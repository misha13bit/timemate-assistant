<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TimeMate Assistant</title>
  <style>
    :root{
      --bg:#0d1117;
      --panel:#161b22;
      --panel-2:#1f2630;
      --panel-3:#263041;
      --text:#f3f6fb;
      --muted:#9aa4b2;
      --border:rgba(255,255,255,0.09);
      --accent:#00ffa2;
      --accent-2:#00d98c;
      --danger:#ff5d5d;
      --warning:#ffb547;
      --info:#67b7ff;
      --shadow:0 18px 45px rgba(0,0,0,0.35);
      --focus:0 0 0 4px rgba(0,255,162,0.12);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }

    body{
      margin:0;
      font-family:"Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      background:
        radial-gradient(circle at top right, rgba(0,255,162,0.08), transparent 25%),
        radial-gradient(circle at bottom left, rgba(103,183,255,0.06), transparent 30%),
        var(--bg);
      color:var(--text);
      display:flex;
      min-height:100vh;
      overflow:hidden;
    }

    .menu{
      width:320px;
      min-width:320px;
      background:rgba(22,27,34,0.96);
      border-right:1px solid var(--border);
      padding:24px 18px 18px;
      display:flex;
      flex-direction:column;
      gap:16px;
      backdrop-filter:blur(10px);
      box-shadow:inset -1px 0 0 rgba(255,255,255,0.03);
      z-index:2;
      overflow:auto;
    }

    .brand{
      display:flex;
      flex-direction:column;
      gap:6px;
      padding:6px 8px 2px;
    }

    .brand h1{
      margin:0;
      font-size:1.15rem;
      letter-spacing:1px;
    }

    .brand p{
      margin:0;
      color:var(--muted);
      font-size:0.83rem;
      line-height:1.45;
    }

    .languagePanel{
      display:flex;
      flex-direction:column;
      gap:8px;
      padding:0 8px 4px;
      position:relative;
    }

    .languageLabel{
      font-size:0.8rem;
      color:var(--muted);
      letter-spacing:0.3px;
      text-transform:uppercase;
    }

    .languageDropdown{
      position:relative;
    }

    .languageToggle{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:13px 14px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.08);
      background:linear-gradient(180deg, #222a35, #1b222c);
      color:#fff;
      font-size:0.92rem;
      font-weight:700;
      font-family:inherit;
      cursor:pointer;
      box-shadow:0 8px 18px rgba(0,0,0,0.18);
      transition:0.2s ease;
    }

    .languageToggle:hover{
      transform:translateY(-1px);
      border-color:rgba(255,255,255,0.16);
      background:linear-gradient(180deg, #283241, #202837);
    }

    .languageChevron{
      color:var(--muted);
      font-size:0.9rem;
      transition:transform 0.2s ease;
    }

    .languageDropdown.open .languageChevron{
      transform:rotate(180deg);
    }

    .languageMenu{
      position:absolute;
      top:calc(100% + 8px);
      left:0;
      width:100%;
      padding:8px;
      border-radius:18px;
      background:linear-gradient(180deg, rgba(25,32,42,0.98), rgba(15,20,27,0.99));
      border:1px solid rgba(255,255,255,0.08);
      box-shadow:0 18px 45px rgba(0,0,0,0.35);
      display:none;
      z-index:60;
    }

    .languageDropdown.open .languageMenu{
      display:block;
      animation:fadeIn 0.18s ease;
    }

    .languageOption{
      width:100%;
      border:none;
      background:transparent;
      color:#fff;
      padding:12px 14px;
      border-radius:12px;
      cursor:pointer;
      font-family:inherit;
      font-size:0.92rem;
      font-weight:700;
      text-align:left;
      transition:0.18s ease;
    }

    .languageOption:hover,
    .languageOption.active{
      background:rgba(0,255,162,0.10);
      color:#fff;
    }

    .tabs{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .menu button.tabBtn{
      width:100%;
      background:linear-gradient(180deg, #222a35, #1b222c);
      color:var(--text);
      padding:15px 16px;
      font-size:16px;
      border:1px solid var(--border);
      border-radius:14px;
      cursor:pointer;
      text-align:left;
      transition:0.25s ease;
      font-weight:700;
      box-shadow:0 8px 18px rgba(0,0,0,0.18);
      font-family:inherit;
    }

    .menu button.tabBtn:hover{
      transform:translateY(-1px);
      border-color:rgba(255,255,255,0.16);
      background:linear-gradient(180deg, #283241, #202837);
    }

    .menu button.tabBtn.active{
      background:linear-gradient(180deg, rgba(0,255,162,0.18), rgba(0,255,162,0.08));
      border-color:rgba(0,255,162,0.35);
      color:#fff;
      box-shadow:0 0 0 1px rgba(0,255,162,0.08), 0 10px 28px rgba(0,255,162,0.08);
    }

    #alarmSidebarSection{
      display:none;
      animation:fadeIn 0.2s ease;
    }

    .panelTitle{
      margin:4px 8px 0;
      font-size:0.83rem;
      color:var(--muted);
      letter-spacing:0.4px;
      text-transform:uppercase;
    }

    #alarmList{
      margin:12px 0 0 0;
      padding:0 4px 4px;
      list-style:none;
      display:flex;
      flex-direction:column;
      gap:10px;
      overflow:auto;
      min-height:120px;
      max-height:calc(100vh - 420px);
      scrollbar-width:thin;
    }

    .alarmItem{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      background:linear-gradient(180deg, rgba(38,48,65,0.78), rgba(29,36,46,0.92));
      border:1px solid var(--border);
      border-radius:14px;
      padding:12px 12px 12px 14px;
      box-shadow:var(--shadow);
    }

    .alarmLeft{
      display:flex;
      flex-direction:column;
      gap:4px;
      min-width:0;
    }

    .alarmTime{
      font-size:1.2rem;
      font-weight:700;
      white-space:nowrap;
      letter-spacing:1px;
    }

    .alarmMeta{
      color:var(--muted);
      font-size:0.8rem;
    }

    .alarmRight{
      display:flex;
      align-items:center;
      gap:8px;
      flex-shrink:0;
    }

    .miniBtn{
      border:none;
      cursor:pointer;
      border-radius:10px;
      padding:8px 11px;
      font-size:14px;
      font-weight:700;
      transition:0.2s ease;
      color:#fff;
      border:1px solid transparent;
      min-width:56px;
      font-family:inherit;
    }

    .miniBtn:hover{ transform:scale(1.06); }

    .toggleBtn.onAction{
      background:rgba(255,93,93,0.14);
      color:#ffd4d4;
      border-color:rgba(255,93,93,0.18);
    }

    .toggleBtn.offAction{
      background:rgba(0,255,162,0.16);
      color:var(--accent);
      border-color:rgba(0,255,162,0.2);
    }

    .deleteBtn{
      background:rgba(255,255,255,0.08);
      color:#d5deea;
      border-color:rgba(255,255,255,0.1);
    }

    .main{
      position:relative;
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      padding:44px 24px 132px;
      overflow:auto;
      overflow-x:hidden;
      scroll-padding-top:24px;
      scroll-padding-bottom:132px;
    }

    .screen{
      width:100%;
      max-width:1120px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      gap:22px;
      padding:12px 0 26px;
      animation:fadeIn 0.25s ease;
    }

    #homeContent{
      display:none;
      overflow:visible;
      isolation:isolate;
      padding-top:18px;
      padding-bottom:34px;
    }

    #homeFxCanvas{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      pointer-events:none;
      z-index:0;
      opacity:0;
      transition:opacity 0.25s ease;
      -webkit-mask-image: radial-gradient(
        circle at center,
        rgba(0,0,0,1) 0%,
        rgba(0,0,0,1) 52%,
        rgba(0,0,0,0.82) 70%,
        rgba(0,0,0,0.28) 84%,
        transparent 100%
      );
      mask-image: radial-gradient(
        circle at center,
        rgba(0,0,0,1) 0%,
        rgba(0,0,0,1) 52%,
        rgba(0,0,0,0.82) 70%,
        rgba(0,0,0,0.28) 84%,
        transparent 100%
      );
    }

    .main.home-fx-active #homeFxCanvas{
      opacity:0.95;
    }

    #homeContent,
    #alarmContent,
    #stopwatch,
    #calculator,
    #notesContent,
    #translatorContent{
      position:relative;
      z-index:1;
    }

    #alarmContent{ display:none; }
    #stopwatch{ display:none; }
    #calculator{ display:none; }
    #notesContent{ display:none; }
    #translatorContent{ display:none; }

    .heroCard{
      width:100%;
      background:linear-gradient(180deg, rgba(24,30,40,0.78), rgba(16,21,29,0.92));
      border:1px solid var(--border);
      border-radius:28px;
      padding:30px 24px;
      box-shadow:var(--shadow);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:22px;
      backdrop-filter:blur(10px);
    }

    .homeCard{
      gap:20px;
      text-align:center;
    }

    .homeBadge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:8px 14px;
      border-radius:999px;
      background:rgba(0,255,162,0.11);
      border:1px solid rgba(0,255,162,0.18);
      color:var(--accent);
      font-size:0.8rem;
      font-weight:700;
      letter-spacing:0.3px;
    }

    .homeTitle{
      margin:0;
      font-size:clamp(2rem, 5vw, 3.5rem);
      line-height:1.05;
      letter-spacing:1px;
      text-shadow:0 0 18px rgba(0,255,162,0.18);
    }

    .homeDescription{
      margin:0;
      max-width:820px;
      color:#d7dee8;
      font-size:1rem;
      line-height:1.7;
    }

    .homeSearchWrap{
      position:relative;
      width:min(780px, 100%);
      margin-top:4px;
    }

    .searchShell{
      display:flex;
      align-items:center;
      gap:12px;
      width:100%;
      padding:12px;
      border-radius:22px;
      background:linear-gradient(180deg, rgba(30,38,49,0.92), rgba(18,24,32,0.98));
      border:1px solid rgba(255,255,255,0.08);
      box-shadow:0 14px 35px rgba(0,0,0,0.22);
    }

    #featureSearch{
      flex:1;
      min-width:0;
      height:56px;
      border:none;
      outline:none;
      border-radius:16px;
      background:rgba(255,255,255,0.03);
      color:#fff;
      padding:0 18px;
      font-size:1rem;
      font-weight:700;
      font-family:inherit;
    }

    #featureSearch::placeholder{
      color:#8e98a8;
    }

    #featureSearchBtn{
      height:56px;
      padding:0 22px;
      border-radius:16px;
      background:linear-gradient(180deg, var(--accent), var(--accent-2));
      color:#03140d;
      box-shadow:0 10px 24px rgba(0,255,162,0.16);
      flex-shrink:0;
      border:none;
      cursor:pointer;
      font-family:inherit;
      font-weight:800;
    }

    .searchSuggestions{
      position:absolute;
      top:calc(100% + 10px);
      left:0;
      width:100%;
      padding:10px;
      border-radius:20px;
      background:linear-gradient(180deg, rgba(25,32,42,0.98), rgba(15,20,27,0.99));
      border:1px solid rgba(255,255,255,0.08);
      box-shadow:0 18px 45px rgba(0,0,0,0.35);
      display:none;
      z-index:30;
    }

    .searchSuggestions.visible{
      display:block;
      animation:fadeIn 0.16s ease;
    }

    .suggestionItem{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      border:none;
      border-radius:14px;
      background:transparent;
      color:#fff;
      padding:12px 14px;
      cursor:pointer;
      font-family:inherit;
      font-size:0.95rem;
      font-weight:700;
      text-align:left;
      transition:0.18s ease;
    }

    .suggestionItem:hover{
      background:rgba(255,255,255,0.06);
      transform:none;
    }

    .suggestionHint{
      color:var(--muted);
      font-size:0.78rem;
      font-weight:600;
      flex-shrink:0;
    }

    .searchHistorySection{
      width:min(780px, 100%);
      display:flex;
      flex-direction:column;
      gap:12px;
      margin-top:6px;
    }

    .searchHistoryHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }

    .searchHistoryTitle{
      color:#dce4ef;
      font-size:0.95rem;
      font-weight:700;
      letter-spacing:0.3px;
    }

    .clearHistoryBtn{
      padding:10px 16px;
      border-radius:12px;
      background:rgba(255,255,255,0.06);
      color:#dbe3ee;
      font-size:0.84rem;
      border:1px solid rgba(255,255,255,0.08);
      font-family:inherit;
      font-weight:700;
      cursor:pointer;
    }

    .searchHistoryList{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      justify-content:center;
      min-height:24px;
    }

    .historyChip{
      padding:10px 14px;
      border-radius:999px;
      background:rgba(255,255,255,0.06);
      color:#edf3fb;
      border:1px solid rgba(255,255,255,0.08);
      font-size:0.85rem;
      font-weight:700;
      cursor:pointer;
      transition:0.18s ease;
      font-family:inherit;
    }

    .historyChip:hover{
      transform:translateY(-1px);
      background:rgba(0,255,162,0.1);
      border-color:rgba(0,255,162,0.16);
    }

    .emptyHint{
      color:var(--muted);
      font-size:0.9rem;
      line-height:1.5;
    }

    .homeGrid{
      width:100%;
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:16px;
    }

    .infoPanel{
      min-height:240px;
      padding:20px;
      border-radius:24px;
      background:linear-gradient(180deg, rgba(24,30,40,0.88), rgba(15,20,27,0.95));
      border:1px solid rgba(255,255,255,0.08);
      box-shadow:var(--shadow);
      display:flex;
      flex-direction:column;
      gap:16px;
    }

    .infoPanelHeader{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .infoPanelTitle{
      font-size:1rem;
      font-weight:800;
      letter-spacing:0.3px;
    }

    .refreshMiniBtn{
      padding:10px 14px;
      border-radius:12px;
      background:rgba(255,255,255,0.06);
      color:#dce5ef;
      border:1px solid rgba(255,255,255,0.08);
      font-size:0.8rem;
      font-weight:700;
      cursor:pointer;
      font-family:inherit;
    }

    .weatherBlock,
    .currencyBlock{
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:14px;
    }

    .weatherMain{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .weatherIcon{
      font-size:3rem;
      line-height:1;
    }

    .weatherTemp{
      font-size:2.7rem;
      font-weight:800;
      line-height:1;
      text-align:right;
    }

    .weatherLabel{
      color:#dce5ef;
      font-size:1rem;
      font-weight:700;
    }

    .weatherMeta{
      color:var(--muted);
      font-size:0.9rem;
      line-height:1.6;
    }

    .currencyRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:14px 0;
      border-bottom:1px solid rgba(255,255,255,0.07);
    }

    .currencyRow:last-child{
      border-bottom:none;
      padding-bottom:0;
    }

    .currencyPair{
      display:flex;
      flex-direction:column;
      gap:5px;
    }

    .currencyName{
      font-size:0.95rem;
      font-weight:800;
    }

    .currencySub{
      color:var(--muted);
      font-size:0.78rem;
    }

    .currencyValue{
      font-size:1.15rem;
      font-weight:800;
      text-align:right;
    }

    .currencyDate{
      color:var(--muted);
      font-size:0.82rem;
      line-height:1.5;
    }

    .quickTools{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
      margin-top:auto;
    }

    .quickToolBtn{
      width:100%;
      padding:16px 18px;
      border-radius:18px;
      background:linear-gradient(180deg, rgba(42,53,67,0.9), rgba(28,36,46,0.96));
      color:#fff;
      border:1px solid rgba(255,255,255,0.08);
      text-align:left;
      font-size:0.95rem;
      font-weight:800;
      box-shadow:0 12px 25px rgba(0,0,0,0.22);
      cursor:pointer;
      font-family:inherit;
    }

    .quickToolBtn small{
      display:block;
      margin-top:6px;
      color:#b3becc;
      font-size:0.78rem;
      font-weight:600;
      line-height:1.45;
    }

    #currentTime{
      font-size:clamp(3.1rem, 8vw, 7rem);
      font-weight:700;
      letter-spacing:6px;
      text-shadow:0 0 18px rgba(0,255,162,0.55), 0 0 34px rgba(0,255,162,0.18);
      text-align:center;
      line-height:1;
      word-break:break-word;
    }

    #nextAlarmInfo{
      font-size:0.95rem;
      color:var(--muted);
      text-align:center;
      min-height:1.4em;
    }

    #alarmControls{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
    }

    .controlRow{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      flex-wrap:wrap;
    }

    input[type="time"]{
      appearance:none;
      min-width:220px;
      padding:15px 16px;
      font-size:1.1rem;
      border-radius:14px;
      border:1px solid var(--border);
      background:#202733;
      color:#fff;
      font-weight:700;
      outline:none;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,0.02);
      font-family:inherit;
    }

    input[type="time"]:focus{
      border-color:rgba(0,255,162,0.35);
      box-shadow:var(--focus);
    }

    button{
      border:none;
      cursor:pointer;
      border-radius:14px;
      padding:15px 22px;
      font-size:16px;
      font-weight:800;
      transition:0.22s ease;
      letter-spacing:0.2px;
      font-family:inherit;
    }

    button:hover{ transform:translateY(-1px) scale(1.02); }

    .setBtn{
      background:linear-gradient(180deg, var(--accent), var(--accent-2));
      color:#03140d;
      box-shadow:0 10px 24px rgba(0,255,162,0.18);
    }

    #stopBtn{
      background:linear-gradient(180deg, #ff6d6d, var(--danger));
      color:#fff;
      display:none;
    }

    #snoozeBtn{
      background:linear-gradient(180deg, #ffc96b, var(--warning));
      color:#1a1203;
      display:none;
    }

    #alarmMessage{
      font-size:clamp(1.6rem, 5vw, 3rem);
      font-weight:800;
      color:#ff8080;
      display:none;
      text-align:center;
      animation:wakeup 1.1s infinite;
      text-shadow:0 0 22px rgba(255,93,93,0.24);
    }

    #stopwatch .heroCard{
      gap:28px;
    }

    #swTime{
      font-size:clamp(2.5rem, 7vw, 6rem);
      font-weight:700;
      color:#fff;
      text-shadow:0 0 14px rgba(0,255,162,0.45), 0 0 24px rgba(0,255,162,0.12);
      text-align:center;
    }

    .swButtons{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:12px;
    }

    .swBtn.start{ background:linear-gradient(180deg, var(--accent), var(--accent-2)); color:#03140d; }
    .swBtn.pause{ background:linear-gradient(180deg, #ff6d6d, var(--danger)); color:#fff; }
    .swBtn.reset{ background:linear-gradient(180deg, #8593a8, #6d7a8b); color:#fff; }

    .calcCard{
      max-width:520px;
      gap:18px;
      padding:22px;
    }

    .calcTop{
      width:100%;
      background:linear-gradient(180deg, rgba(26,33,43,0.92), rgba(17,22,29,0.95));
      border:1px solid rgba(255,255,255,0.08);
      border-radius:24px;
      padding:18px 18px 14px;
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      gap:8px;
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.03);
    }

    #calcExpression{
      width:100%;
      min-height:22px;
      font-size:0.9rem;
      color:var(--muted);
      text-align:right;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    #calcDisplay{
      width:100%;
      text-align:right;
      font-size:clamp(2.8rem, 7vw, 4.6rem);
      font-weight:700;

    button:focus-visible,
    input:focus-visible,
    .historyChip:focus-visible,

    @keyframes wakeup{
      0%{ transform:scale(1) rotate(0deg); }
      25%{ transform:scale(1.03) rotate(-1.5deg); }
      50%{ transform:scale(1.08) rotate(1.5deg); }
      75%{ transform:scale(1.03) rotate(-1.5deg); }
      100%{ transform:scale(1) rotate(0deg); }
    }

    @keyframes slideInUp{
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes bounceOut{
      0%{ transform:scale(1) translateY(0); opacity:1; }
      30%{ transform:scale(1.05) translateY(-8px); opacity:1; }
      100%{ transform:scale(0.88) translateY(-30px); opacity:0; }
    }

    @keyframes fadeIn{
      from{ opacity:0; transform:translateY(6px); }
      to{ opacity:1; transform:translateY(0); }
    }

        <div id="languageMenu" class="languageMenu">

          <button class="languageOption" type="button" data-lang="en">English</button>

      </div>
    </div>

    <div class="tabs">

      <button id="alarmTab" class="tabBtn" type="button"></button>
      <button id="stopwatchTab" class="tabBtn" type="button"></button>
      <button id="calculatorTab" class="tabBtn" type="button"></button>
      <button id="notesTab" class="tabBtn" type="button"></button>
      <button id="translatorTab" class="tabBtn" type="button"></button>

    <div id="alarmSidebarSection">

      <ul id="alarmList" aria-live="polite"></ul>
    </div>
  </aside>

        <p id="homeDescription" class="homeDescription"></p>

        <div class="homeSearchWrap">
          <div class="searchShell">
            <input id="featureSearch" type="text" autocomplete="off" spellcheck="false" />
            <button id="featureSearchBtn" type="button"></button>
          </div>
          <div id="searchSuggestions" class="searchSuggestions"></div>
        </div>

        <div class="searchHistorySection">
          <div class="searchHistoryHeader">
            <div id="searchHistoryTitle" class="searchHistoryTitle"></div>
            <button id="clearSearchHistoryBtn" class="clearHistoryBtn" type="button"></button>
          </div>
          <div id="searchHistoryList" class="searchHistoryList"></div>
        </div>
      </div>

      <div class="homeGrid">
        <div class="infoPanel">
          <div class="infoPanelHeader">
            <div id="weatherPanelTitle" class="infoPanelTitle"></div>
            <button id="refreshWeatherBtn" class="refreshMiniBtn" type="button"></button>
          </div>
          <div id="weatherBlock" class="weatherBlock">
            <div class="emptyHint"></div>
          </div>
        </div>

        <div class="infoPanel">
          <div class="infoPanelHeader">
            <div id="currencyPanelTitle" class="infoPanelTitle"></div>
            <button id="refreshCurrencyBtn" class="refreshMiniBtn" type="button"></button>

        <div class="infoPanel">
          <div class="infoPanelHeader">
            <div id="frequentPanelTitle" class="infoPanelTitle"></div>
          </div>
          <div id="frequentTools" class="quickTools"></div>
        </div>
      </div>
    </section>

    <section id="alarmContent" class="screen">
      <div class="heroCard">
        <div id="currentTime">00:00:00</div>
        <div id="nextAlarmInfo"></div>

        <div id="alarmControls">
          <div class="controlRow">
            <input type="time" id="alarmTime" />
          </div>

          <div class="controlRow">
            <button class="setBtn" id="setAlarmBtn" type="button"></button>
            <button id="stopBtn" type="button"></button>
            <button id="snoozeBtn" type="button"></button>
          </div>
        </div>

        <div id="alarmMessage">⏰</div>
      </div>
    </section>

    <section id="stopwatch" class="screen">
      <div class="heroCard">
        <div id="swTime">00:00:00.00</div>
        <div class="swButtons">
          <button class="swBtn start" id="swStartBtn" type="button"></button>
          <button class="swBtn pause" id="swPauseBtn" type="button"></button>
          <button class="swBtn reset" id="swResetBtn" type="button"></button>
        </div>
      </div>
    </section>

    <section id="calculator" class="screen">
      <div class="heroCard calcCard">
        <div class="calcTop">
          <div id="calcExpression">0</div>
          <div id="calcDisplay">0</div>
        </div>

        <div class="calculatorGrid" id="calculatorGrid">
          <button class="calcBtn function" type="button" data-action="clear">AC</button>
          <button class="calcBtn function" type="button" data-action="sign">±</button>
          <button class="calcBtn function" type="button" data-action="percent">%</button>
          <button class="calcBtn operator" type="button" data-action="operator" data-value="/">÷</button>

          <button class="calcBtn" type="button" data-action="digit" data-value="7">7</button>
          <button class="calcBtn" type="button" data-action="digit" data-value="8">8</button>
          <button class="calcBtn" type="button" data-action="digit" data-value="9">9</button>
          <button class="calcBtn operator" type="button" data-action="operator" data-value="*">×</button>

          <button class="calcBtn" type="button" data-action="digit" data-value="5">5</button>
          <button class="calcBtn" type="button" data-action="digit" data-value="6">6</button>
          <button class="calcBtn operator" type="button" data-action="operator" data-value="-">−</button>

          <button class="calcBtn" type="button" data-action="digit" data-value="1">1</button>
          <button class="calcBtn" type="button" data-action="digit" data-value="2">2</button>
          <button class="calcBtn" type="button" data-action="digit" data-value="3">3</button>
          <button class="calcBtn operator" type="button" data-action="operator" data-value="+">+</button>

          <button class="calcBtn zero" type="button" data-action="digit" data-value="0">0</button>
          <button class="calcBtn" type="button" data-action="decimal">,</button>
          <button class="calcBtn equals" type="button" data-action="equals">=</button>
        </div>
      </div>
    </section>

    <section id="notesContent" class="screen">

      function parseStorage(key) {
        const raw = localStorage.getItem(key);
        if (!raw) return null;
        try {
          return JSON.parse(raw);
        } catch {
          return null;
        }
      }

      function safeRandomId() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          return window.crypto.randomUUID();
        }
        return `alarm_${Date.now()}_${Math.random().toString(16).slice(2)}`;
      }

      function normalizeTime(value) {
        if (!value || typeof value !== 'string') return '';
        const match = value.match(/^(\d{2}):(\d{2})$/);
        if (!match) return '';
        const h = Number(match[1]);
        const m = Number(match[2]);
        if (h < 0 || h > 23 || m < 0 || m > 59) return '';
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      }

      function normalizeText(value) {
        return String(value || '').trim().toLowerCase();
      }

      function hydrateAlarmItems(items) {
        return items
          .map(item => ({
            id: item.id || safeRandomId(),
            time: normalizeTime(item.time),
            enabled: item.enabled !== false,
            oneTime: Boolean(item.oneTime),
            lastTriggeredDate: item.lastTriggeredDate || null
          }))
          .filter(item => item.time);
      }



      function hydrateNotes(items) {
        return (Array.isArray(items) ? items : [])
          .map(item => {
            const now = new Date().toISOString();
            return {
              id: item?.id || safeRandomId(),
              title: typeof item?.title === 'string' ? item.title.slice(0, 160) : '',
              body: typeof item?.body === 'string' ? item.body : '',
              pinned: Boolean(item?.pinned),
              createdAt: item?.createdAt || now,
              updatedAt: item?.updatedAt || item?.createdAt || now
            };
          })
          .filter(item => item.id);
      }


      function hydrateTranslator(data, language = state.language) {
        const defaults = getDefaultTranslatorState(language);
        const from = normalizeTranslatorLanguageCode(data?.from, true) || defaults.from;
        let to = normalizeTranslatorLanguageCode(data?.to) || defaults.to;

        if (to === from) {
          to = getTranslatorDefaultTarget(language);
        }

        const history = Array.isArray(data?.history) ? data.history : [];

        return {
          from,
          to,
          inputText: typeof data?.inputText === 'string' ? data.inputText.slice(0, 5000) : '',
          outputText: typeof data?.outputText === 'string' ? data.outputText.slice(0, 20000) : '',
          autoMode: data?.autoMode !== false,
          detectedLanguage: normalizeTranslatorLanguageCode(data?.detectedLanguage) || '',
          history: history
            .map(item => ({
              id: item?.id || safeRandomId(),
              from: normalizeTranslatorLanguageCode(item?.from, true) || defaults.from,
              to: normalizeTranslatorLanguageCode(item?.to) || defaults.to,
              sourceText: typeof item?.sourceText === 'string' ? item.sourceText.slice(0, 5000) : '',
              translatedText: typeof item?.translatedText === 'string' ? item.translatedText.slice(0, 20000) : '',
              detectedLanguage: normalizeTranslatorLanguageCode(item?.detectedLanguage) || '',
              createdAt: item?.createdAt || new Date().toISOString()
            }))
            .filter(item => item.sourceText && item.translatedText)
            .slice(0, 10)
        };
      }

      function getSortedNotes(list = state.notes) {
        return [...list].sort((a, b) => {
          if (Number(b.pinned) !== Number(a.pinned)) return Number(b.pinned) - Number(a.pinned);
          return new Date(b.updatedAt).getTime() - new Date(a.updatedAt).getTime();
        });
      }

      function sortAlarms() {
        state.alarms.sort((a, b) => a.time.localeCompare(b.time));
      }

      function cleanupStaleOneTimeAlarms() {
        const before = state.alarms.length;
        state.alarms = state.alarms.filter(alarm => !(alarm.oneTime && alarm.lastTriggeredDate));
        if (before !== state.alarms.length) {
          saveState();
        }
      }

      function loadState() {
        const candidates = [STORAGE_KEY, ...LEGACY_KEYS];

        for (const key of candidates) {
          const parsed = parseStorage(key);

          if (parsed && typeof parsed === 'object' && Array.isArray(parsed.alarms)) {
            state.language = translations[parsed.language] ? parsed.language : 'ru';
            state.alarms = hydrateAlarmItems(parsed.alarms);
            state.notes = hydrateNotes(parsed.notes);
            state.activeNoteId = getSortedNotes(state.notes)[0]?.id || null;
            state.notesSearchQuery = '';
            state.translator = hydrateTranslator(parsed.translator, state.language);
            state.searchHistory = Array.isArray(parsed.searchHistory) ? parsed.searchHistory.filter(Boolean).slice(0, 8) : [];
            state.usage = parsed.usage && typeof parsed.usage === 'object' ? parsed.usage : {};
            state.translatorBusy = false;
            state.translatorAbortController = null;
            state.translatorDebounceId = null;
            state.translatorCache = new Map();
            state.translatorStatusMessage = '';
            state.translatorStatusType = 'info';

            sortAlarms();
            cleanupStaleOneTimeAlarms();
            saveState();
            return;
          }

          if (Array.isArray(parsed)) {
            state.language = 'ru';
            state.alarms = parsed
              .map(time => ({
                id: safeRandomId(),
                time: normalizeTime(time),
                enabled: true,
                oneTime: false,
                lastTriggeredDate: null
              }))
              .filter(item => item.time);
            state.notes = [];
            state.activeNoteId = null;
            state.notesSearchQuery = '';
            state.translator = getDefaultTranslatorState(state.language);
            state.searchHistory = [];
            state.usage = {};
            state.translatorBusy = false;
            state.translatorAbortController = null;
            state.translatorDebounceId = null;
            state.translatorCache = new Map();
            state.translatorStatusMessage = '';
            state.translatorStatusType = 'info';

            sortAlarms();
            saveState();
            return;
          }
        }

        state.language = 'ru';
        state.alarms = [];
        state.notes = [];
        state.activeNoteId = null;
        state.notesSearchQuery = '';
        state.translator = getDefaultTranslatorState(state.language);
        state.searchHistory = [];
        state.usage = {};
            state.translatorBusy = false;
            state.translatorAbortController = null;
            state.translatorDebounceId = null;
            state.translatorCache = new Map();
            state.translatorStatusMessage = '';
            state.translatorStatusType = 'info';

        saveState();
      }

      function incrementUsage(key) {
        state.usage[key] = (state.usage[key] || 0) + 1;
        saveState();
        renderFrequentTools();
      }

      function showNotification(text, type = 'info') {
        const icons = {
          success: '✅',
          error: '❌',
          warning: '⚠️',
          info: 'ℹ️'
        };

        const typeClass = ['success', 'error', 'warning', 'info'].includes(type) ? type : 'info';

        const node = document.createElement('div');
        node.className = `notification ${typeClass}`;
        node.textContent = `${icons[typeClass]} ${text}`;

        let removed = false;
        const removeNode = () => {
          if (removed) return;
          removed = true;
          node.classList.add('hide');
          setTimeout(() => node.remove(), 450);
        };

        node.addEventListener('click', removeNode);
        dom.notifications.appendChild(node);
        setTimeout(removeNode, 5000);
      }

      function syncHomeFxLoop() {
        const shouldRun = state.activeTab === 'home' && !document.hidden && state.fxCtx;
        if (shouldRun && state.fxFrameId === null) {
          state.fxFrameId = requestAnimationFrame(drawHomeFx);
          return;
        }

        if (!shouldRun && state.fxFrameId !== null) {
          cancelAnimationFrame(state.fxFrameId);
          state.fxFrameId = null;
          if (state.fxCtx) {
            state.fxCtx.setTransform(state.fxDpr, 0, 0, state.fxDpr, 0, 0);
            state.fxCtx.clearRect(0, 0, state.fxWidth, state.fxHeight);
          }
        }
      }

      function getTodayKey() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;

      function updateCurrentTime() {

      function getAlarmById(id) {

      function formatAlarmMeta(alarm) {
        const alarmT = tr().alarm;
        const status = alarm.enabled ? alarmT.statusOn : alarmT.statusOff;
        const mode = alarm.oneTime ? alarmT.oneTime : alarmT.daily;
        return `${status} • ${mode}`;
      }

      function renderAlarmList() {
        dom.alarmList.innerHTML = '';
        dom.alarmSidebarTitle.textContent = tr().sidebar.alarms;

        if (state.alarms.length === 0) {
          const empty = document.createElement('li');
          empty.className = 'alarmItem';

          const left = document.createElement('div');
          left.className = 'alarmLeft';

          time.className = 'alarmTime';

          const meta = document.createElement('div');
          meta.className = 'alarmMeta';
          meta.textContent = tr().sidebar.empty;

          left.append(time, meta);
          empty.appendChild(left);
          dom.alarmList.appendChild(empty);
          updateNextAlarmInfo();
          return;
        }

        sortAlarms();

        state.alarms.forEach(alarm => {
          const li = document.createElement('li');
          li.className = 'alarmItem';

          const left = document.createElement('div');
          left.className = 'alarmLeft';

          const time = document.createElement('div');
          time.className = 'alarmTime';
          time.textContent = alarm.time;

          const meta = document.createElement('div');
          meta.className = 'alarmMeta';
          meta.textContent = formatAlarmMeta(alarm);

          left.append(time, meta);

          const right = document.createElement('div');
          right.className = 'alarmRight';

          const toggleBtn = document.createElement('button');
          toggleBtn.type = 'button';
          toggleBtn.className = `miniBtn toggleBtn ${alarm.enabled ? 'onAction' : 'offAction'}`;
          toggleBtn.textContent = alarm.enabled ? tr().alarm.buttons.off : tr().alarm.buttons.on;
          toggleBtn.addEventListener('click', () => toggleAlarm(alarm.id));

          const deleteBtn = document.createElement('button');
          deleteBtn.type = 'button';
          deleteBtn.className = 'miniBtn deleteBtn';
          deleteBtn.textContent = '🗑';
          deleteBtn.setAttribute('aria-label', `${tr().alarm.deleted(alarm.time)}`);
          deleteBtn.addEventListener('click', () => deleteAlarm(alarm.id));

          right.append(toggleBtn, deleteBtn);
          li.append(left, right);
          dom.alarmList.appendChild(li);
        });

        updateNextAlarmInfo();
      }

      function addAlarm(time, { oneTime = false } = {}) {
        const normalized = normalizeTime(time);
        const alarmT = tr().alarm;

        if (!normalized) {
          showNotification(alarmT.invalid, 'warning');
          return;
        }

        const duplicate = state.alarms.some(alarm => alarm.time === normalized && alarm.oneTime === oneTime);
        if (duplicate) {
          showNotification(alarmT.exists(normalized), 'warning');
          return;
        }

        state.alarms.push({
          id: safeRandomId(),
          time: normalized,
          enabled: true,
          oneTime,
          lastTriggeredDate: null
        });

        sortAlarms();
        saveState();
        renderAlarmList();
        incrementUsage('set_alarm');

        showNotification(oneTime ? alarmT.addedSnooze(normalized) : alarmT.added(normalized), 'success');
      }

      function deleteAlarm(id) {
        const alarm = getAlarmById(id);
        if (!alarm) return;

        state.alarms = state.alarms.filter(item => item.id !== id);
        saveState();
        renderAlarmList();
        showNotification(tr().alarm.deleted(alarm.time), 'error');
      }

      function toggleAlarm(id) {
        const alarm = getAlarmById(id);
        if (!alarm) return;

        alarm.enabled = !alarm.enabled;
        saveState();
        renderAlarmList();

        showNotification(
          alarm.enabled ? tr().alarm.enabled(alarm.time) : tr().alarm.disabled(alarm.time),
          alarm.enabled ? 'success' : 'warning'
        );
      }

      function getNextAlarmText() {
        const now = new Date();
        const enabledAlarms = state.alarms.filter(alarm => alarm.enabled && !(alarm.oneTime && alarm.lastTriggeredDate));
        const alarmT = tr().alarm;

        if (enabledAlarms.length === 0) return alarmT.nextNone;

        let bestAlarm = null;
        let bestDate = null;

        enabledAlarms.forEach(alarm => {
          const [hours, minutes] = alarm.time.split(':').map(Number);
          const candidate = new Date(now);
          candidate.setHours(hours, minutes, 0, 0);
          if (candidate <= now) candidate.setDate(candidate.getDate() + 1);

          if (!bestDate || candidate < bestDate) {
            bestDate = candidate;
            bestAlarm = alarm;
          }
        });

        if (!bestAlarm || !bestDate) return alarmT.nextNone;

        const diffMs = bestDate - now;
        const diffMin = Math.max(0, Math.round(diffMs / 60000));

        const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const bestDay = new Date(bestDate.getFullYear(), bestDate.getMonth(), bestDate.getDate());
        const dayDiff = Math.round((bestDay - todayStart) / 86400000);

        let dayLabel = alarmT.later;
        if (dayDiff === 0) dayLabel = alarmT.today;
        if (dayDiff === 1) dayLabel = alarmT.tomorrow;

        return alarmT.next(bestAlarm.time, dayLabel, diffMin);
      }

      function updateNextAlarmInfo() {
        dom.nextAlarmInfo.textContent = getNextAlarmText();
      }

      function showAlarmUI(labelText = null) {

      async function unlockAlarmAudio() {

      async function playAlarmSound() {

      function clearOneTimeRingingAlarms() {
        if (!state.ringingAlarmIds.length) return;
        const ringingSet = new Set(state.ringingAlarmIds);
        state.alarms = state.alarms.filter(alarm => !(ringingSet.has(alarm.id) && alarm.oneTime));
      }

      function stopAlarm() {
        if (!state.ringingAlarmIds.length) return;

        stopAlarmSound();
        clearOneTimeRingingAlarms();
        state.ringingAlarmIds = [];
        state.lastRingingLabel = '';
        hideAlarmUI();
        saveState();
        renderAlarmList();
        showNotification(tr().alarm.stopped, 'info');
      }

      function snoozeAlarm() {
        if (!state.ringingAlarmIds.length) return;

        const now = new Date();
        now.setMinutes(now.getMinutes() + 5);
        const snoozeTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

        stopAlarmSound();
        clearOneTimeRingingAlarms();
        state.ringingAlarmIds = [];
        state.lastRingingLabel = '';
        hideAlarmUI();
        saveState();

        addAlarm(snoozeTime, { oneTime: true });
        showNotification(tr().alarm.snoozed(snoozeTime), 'warning');
      }

      function checkAlarms() {
        if (state.ringingAlarmIds.length > 0) return;

        const now = new Date();
        const currentTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        const todayKey = getTodayKey();

        const dueAlarms = state.alarms.filter(alarm => (
          alarm.enabled &&
          alarm.time === currentTime &&
          alarm.lastTriggeredDate !== todayKey
        ));

        if (!dueAlarms.length) return;

        dueAlarms.forEach(alarm => {
          alarm.lastTriggeredDate = todayKey;
        });

        state.ringingAlarmIds = dueAlarms.map(alarm => alarm.id);
        state.lastRingingLabel = dueAlarms.length === 1
          ? tr().alarm.ringingOne(dueAlarms[0].time)
          : tr().alarm.ringingMany(dueAlarms.length);

        saveState();
        renderAlarmList();
        showAlarmUI(state.lastRingingLabel);
        playAlarmSound();

        showNotification(
          dueAlarms.length === 1 ? tr().alarm.firedOne(dueAlarms[0].time) : tr().alarm.firedMany(dueAlarms.length),
          'success'
        );
      }

      function setAlarmFromInput() {
        addAlarm(dom.alarmTime.value, { oneTime: false });

      function formatStopwatchTime(ms) {
        const hours = Math.floor(ms / 3600000);
        const minutes = Math.floor((ms % 3600000) / 60000);
        const seconds = Math.floor((ms % 60000) / 1000);
        const centiseconds = Math.floor((ms % 1000) / 10);
        return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(centiseconds).padStart(2, '0')}`;
      }

      function getCurrentStopwatchMs() {
        if (!state.stopwatch.running) return state.stopwatch.elapsedMs;
        return state.stopwatch.elapsedMs + (performance.now() - state.stopwatch.startedAt);
      }

      function renderStopwatch() {
        dom.swTime.textContent = formatStopwatchTime(getCurrentStopwatchMs());
      }

      function stopwatchTick() {
        renderStopwatch();
        if (state.stopwatch.running) {
          state.stopwatch.rafId = requestAnimationFrame(stopwatchTick);
        }
      }

      function startSW() {
        if (state.stopwatch.running) return;
        state.stopwatch.running = true;
        state.stopwatch.startedAt = performance.now();
        state.stopwatch.rafId = requestAnimationFrame(stopwatchTick);
        incrementUsage('start_stopwatch');
      }

      function pauseSW() {
        if (!state.stopwatch.running) return;
        state.stopwatch.elapsedMs = getCurrentStopwatchMs();
        state.stopwatch.running = false;
        if (state.stopwatch.rafId) {
          cancelAnimationFrame(state.stopwatch.rafId);
          state.stopwatch.rafId = null;
        }
        renderStopwatch();
      }

      function resetSW() {
        state.stopwatch.running = false;
        state.stopwatch.startedAt = 0;
        state.stopwatch.elapsedMs = 0;
        if (state.stopwatch.rafId) {
          cancelAnimationFrame(state.stopwatch.rafId);
          state.stopwatch.rafId = null;
        }
        renderStopwatch();
      }

      function getCalculatorErrorText() {
        return tr().common.calculatorError;
      }

      function calcOperatorLabel(operator) {
        const map = { '+': '+', '-': '−', '*': '×', '/': '÷' };
        return map[operator] || operator;
      }

      function calcNormalizeResult(value) {
        if (!Number.isFinite(value)) return getCalculatorErrorText();
        return Number(value.toPrecision(12)).toString();
      }

      function calcDisplayText(value) {
        const errorText = getCalculatorErrorText();
        if (value === errorText) return value;
        return String(value).replace('.', ',');
      }

      function renderCalculator() {
        dom.calcDisplay.textContent = calcDisplayText(state.calculator.displayValue);
        dom.calcExpression.textContent = state.calculator.expressionText || '0';
      }

      function calculatorResetAll() {
        state.calculator.displayValue = '0';
        state.calculator.storedValue = null;
        state.calculator.pendingOperator = null;
        state.calculator.waitingForNewValue = false;
        state.calculator.expressionText = '0';
        state.calculator.lastOperator = null;
        state.calculator.lastOperand = null;
        renderCalculator();
      }

      function calculatorInputDigit(digit) {
        const calc = state.calculator;
        if (calc.displayValue === getCalculatorErrorText()) calculatorResetAll();

        if (calc.waitingForNewValue) {
          calc.displayValue = digit;
          calc.waitingForNewValue = false;
        } else {
          calc.displayValue = calc.displayValue === '0' ? digit : calc.displayValue + digit;
        }

        renderCalculator();
      }

      function calculatorInputDecimal() {
        const calc = state.calculator;
        if (calc.displayValue === getCalculatorErrorText()) calculatorResetAll();

        if (calc.waitingForNewValue) {
          calc.displayValue = '0.';
          calc.waitingForNewValue = false;
        } else if (!calc.displayValue.includes('.')) {
          calc.displayValue += '.';
        }

        renderCalculator();
      }

      function calculatorBackspace() {
        const calc = state.calculator;
        if (calc.displayValue === getCalculatorErrorText()) {
          calculatorResetAll();
          return;
        }
        if (calc.waitingForNewValue) return;

        if (calc.displayValue.length <= 1 || (calc.displayValue.length === 2 && calc.displayValue.startsWith('-'))) {
          calc.displayValue = '0';
        } else {
          calc.displayValue = calc.displayValue.slice(0, -1);
        }

        renderCalculator();
      }

      function calculatorCompute(a, b, operator) {
        switch (operator) {
          case '+': return a + b;
          case '-': return a - b;
          case '*': return a * b;
          case '/': return b === 0 ? Infinity : a / b;
          default: return b;
        }
      }

      function calculatorSetOperator(nextOperator) {
        const calc = state.calculator;
        if (calc.displayValue === getCalculatorErrorText()) {
          calculatorResetAll();
          return;
        }

        const inputValue = Number(calc.displayValue);

        if (calc.pendingOperator && !calc.waitingForNewValue && calc.storedValue !== null) {
          const result = calculatorCompute(calc.storedValue, inputValue, calc.pendingOperator);
          const normalized = calcNormalizeResult(result);
          calc.displayValue = normalized;
          calc.storedValue = normalized === getCalculatorErrorText() ? null : Number(normalized);

          if (normalized === getCalculatorErrorText()) {
            calc.pendingOperator = null;
            calc.expressionText = getCalculatorErrorText();
            calc.waitingForNewValue = true;
            renderCalculator();
            return;
          }
        } else if (calc.storedValue === null) {
          calc.storedValue = inputValue;
        }

        calc.pendingOperator = nextOperator;
        calc.waitingForNewValue = true;
        calc.lastOperator = null;
        calc.lastOperand = null;
        calc.expressionText = `${calcDisplayText(calc.displayValue)} ${calcOperatorLabel(nextOperator)}`;
        renderCalculator();
      }

      function calculatorEquals() {
        const calc = state.calculator;
        if (calc.displayValue === getCalculatorErrorText()) {
          calculatorResetAll();
          return;
        }

        const currentValue = Number(calc.displayValue);

        if (calc.pendingOperator !== null && calc.storedValue !== null && !calc.waitingForNewValue) {
          const leftValue = calc.storedValue;
          const operator = calc.pendingOperator;
          const result = calculatorCompute(leftValue, currentValue, operator);
          const normalized = calcNormalizeResult(result);

          calc.expressionText = `${calcDisplayText(leftValue)} ${calcOperatorLabel(operator)} ${calcDisplayText(currentValue)} =`;
          calc.displayValue = normalized;

          if (normalized === getCalculatorErrorText()) {
            calc.storedValue = null;
            calc.pendingOperator = null;
            calc.waitingForNewValue = true;
            calc.lastOperator = null;
            calc.lastOperand = null;
            renderCalculator();
            return;
          }

          calc.storedValue = Number(normalized);
          calc.pendingOperator = null;
          calc.waitingForNewValue = true;
          calc.lastOperator = operator;
          calc.lastOperand = currentValue;
          renderCalculator();
          return;
        }

        if (calc.lastOperator !== null && calc.lastOperand !== null) {
          const leftValue = Number(calc.displayValue);
          const result = calculatorCompute(leftValue, calc.lastOperand, calc.lastOperator);
          const normalized = calcNormalizeResult(result);

          calc.expressionText = `${calcDisplayText(leftValue)} ${calcOperatorLabel(calc.lastOperator)} ${calcDisplayText(calc.lastOperand)} =`;
          calc.displayValue = normalized;

          if (normalized === getCalculatorErrorText()) {
            calc.storedValue = null;
            calc.pendingOperator = null;
            calc.waitingForNewValue = true;
            renderCalculator();
            return;
          }

          calc.storedValue = Number(normalized);
          calc.waitingForNewValue = true;
          renderCalculator();
        }
      }

      function calculatorPercent() {
        const calc = state.calculator;
        if (calc.displayValue === getCalculatorErrorText()) {
          calculatorResetAll();
          return;
        }

        const currentValue = Number(calc.displayValue);
        let result;

        if (calc.storedValue !== null && calc.pendingOperator && !calc.waitingForNewValue) {
          result = calc.storedValue * currentValue / 100;
        } else {
          result = currentValue / 100;
        }

        calc.displayValue = calcNormalizeResult(result);
        calc.expressionText = `${calcDisplayText(calc.displayValue)}`;
        renderCalculator();
      }

      function calculatorToggleSign() {
        const calc = state.calculator;
        if (calc.displayValue === getCalculatorErrorText()) {
          calculatorResetAll();
          return;
        }
        if (calc.displayValue === '0') return;

        calc.displayValue = calc.displayValue.startsWith('-')
          ? calc.displayValue.slice(1)
          : `-${calc.displayValue}`;

        renderCalculator();
      }

      function handleCalculatorButton(action, value) {
        incrementUsage('calculator_used');

        switch (action) {
          case 'digit':
            calculatorInputDigit(value);
            break;
          case 'decimal':
            calculatorInputDecimal();
            break;
          case 'operator':
            calculatorSetOperator(value);
            break;
          case 'equals':
            calculatorEquals();
            break;
          case 'clear':
            calculatorResetAll();
            break;
          case 'sign':
            calculatorToggleSign();
            break;
          case 'percent':
            calculatorPercent();
            break;
        }
      }

      function getFeatureLabel(featureId) {
        return tr().tabs[featureId] || featureId;
      }

      function scoreFeature(query, feature) {
        const q = normalizeText(query);
        if (!q) return 0;

        const label = normalizeText(getFeatureLabel(feature.id));
        const aliases = feature.aliases.map(normalizeText);

        if (label === q) return 120;
        if (aliases.includes(q)) return 115;
        if (label.startsWith(q)) return 100;
        if (aliases.some(k => k.startsWith(q))) return 90;
        if (label.includes(q)) return 75;
        if (aliases.some(k => k.includes(q))) return 65;
        return 0;
      }

      function getFeatureMatches(query) {
        return FEATURE_ITEMS
          .map(feature => ({ feature, score: scoreFeature(query, feature) }))
          .filter(item => item.score > 0)
          .sort((a, b) => b.score - a.score || getFeatureLabel(a.feature.id).localeCompare(getFeatureLabel(b.feature.id), state.language))
          .map(item => item.feature);
      }

      function hideSearchSuggestions() {
        dom.searchSuggestions.classList.remove('visible');

            </button>
          `;
          dom.searchSuggestions.classList.add('visible');
          return;
        }

        dom.searchSuggestions.innerHTML = matches.map(item => `
          <button class="suggestionItem" type="button" data-feature-id="${item.id}" data-feature-label="${getFeatureLabel(item.id)}">
            <span>${getFeatureLabel(item.id)}</span>
            <span class="suggestionHint">${tr().search.open}</span>
          </button>
        `).join('');

        dom.searchSuggestions.classList.add('visible');

      function renderSearchHistory() {

          ...state.searchHistory.filter(item => normalizeText(item) !== normalizeText(cleaned))
        ].slice(0, 8);

        renderSearchHistory();

      function executeFeatureSearch(rawQuery) {
        const query = String(rawQuery || '').trim();

        if (!query) {
          showNotification(tr().search.enterQuery, 'warning');
          return;
        }

        const matches = getFeatureMatches(query);
        if (!matches.length) {
          showNotification(tr().search.notFound(query), 'warning');
          return;

        addSearchHistory(query);
        openFeature(matches[0].id, true);
        dom.featureSearch.value = '';
        hideSearchSuggestions();
      }



      function escapeHTML(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function ensureActiveNote() {
        if (!state.notes.length) {
          state.activeNoteId = null;
          return;
        }

        if (!state.notes.some(note => note.id === state.activeNoteId)) {
          state.activeNoteId = getSortedNotes()[0]?.id || null;

      function formatNoteDate(dateString) {
        const date = new Date(dateString);
        if (Number.isNaN(date.getTime())) return '—';

        const now = new Date();
        const locale = state.language === 'en' ? 'en-US' : 'ru-RU';
        const sameDay = date.toDateString() === now.toDateString();
        const sameYear = date.getFullYear() === now.getFullYear();

        const options = sameDay
          ? { hour: '2-digit', minute: '2-digit' }
          : sameYear
            ? { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }
            : { day: 'numeric', month: 'short', year: 'numeric' };

        return new Intl.DateTimeFormat(locale, options).format(date);
      }

      function getFilteredNotes() {
        const query = normalizeText(state.notesSearchQuery);
        const notes = getSortedNotes();

        if (!query) return notes;

        return notes.filter(note => {
          const haystack = `${normalizeText(note.title)} ${normalizeText(note.body)}`;
          return haystack.includes(query);
        });
      }

      function renderNotesCount(filteredCount, totalCount) {
        dom.notesCount.textContent = filteredCount === totalCount

      function updateNoteMeta() {

      function getTranslatorLanguageLabel(code) {

      }

      function getTranslatorHistoryDate(dateString) {
        const date = new Date(dateString);
        if (Number.isNaN(date.getTime())) return '—';

        }).format(date);

      function getTranslatorStatusFallback() {
        if (state.translatorBusy) return { text: tr().translator.translating, type: 'info' };
        if (!state.translator.inputText.trim()) return {
          text: state.translator.autoMode ? tr().translator.autoHint : tr().translator.manualHint,
          type: 'info'
        };
        if (state.translator.from === 'auto' && state.translator.detectedLanguage && state.translator.outputText) {
          return {
            text: tr().translator.detected(getTranslatorLanguageLabel(state.translator.detectedLanguage)),
            type: 'success'
          };
        }
        return {
          text: state.translator.outputText ? tr().translator.translated : tr().translator.ready,
          type: 'info'
        };
      }

      function setTranslatorStatus(message = '', type = 'info') {
        state.translatorStatusMessage = message;
        state.translatorStatusType = type;
        if (state.activeTab === 'translator') renderTranslator();
      }

      function renderTranslatorLanguageOptions() {
        const optionsFrom = TRANSLATOR_LANGUAGES.map(item => {
          const label = getTranslatorLanguageLabel(item.code);
          return `<option value="${escapeHTML(item.code)}">${escapeHTML(label)}</option>`;
        }).join('');

        const optionsTo = TRANSLATOR_LANGUAGES
          .filter(item => item.code !== 'auto')
          .map(item => {
            const label = getTranslatorLanguageLabel(item.code);
            return `<option value="${escapeHTML(item.code)}">${escapeHTML(label)}</option>`;
          }).join('');

        dom.translateFrom.innerHTML = optionsFrom;
        dom.translateTo.innerHTML = optionsTo;
        dom.translateFrom.value = state.translator.from;
        dom.translateTo.value = state.translator.to;

      function renderTranslatorHistory() {
        if (!state.translator.history.length) {
          dom.translatorHistory.innerHTML = `<div class="translatorHistoryEmpty">${escapeHTML(tr().translator.historyEmpty)}</div>`;
          return;
        }

        dom.translatorHistory.innerHTML = state.translator.history.map(item => {
          const fromCode = item.from === 'auto' ? (item.detectedLanguage || 'auto') : item.from;
          const sourceLabel = getTranslatorLanguageLabel(fromCode);
          const targetLabel = getTranslatorLanguageLabel(item.to);
          const meta = tr().translator.historyMeta(sourceLabel, targetLabel, getTranslatorHistoryDate(item.createdAt));
          const sourcePreview = item.sourceText.replace(/\s+/g, ' ').trim().slice(0, 160);
          const resultPreview = item.translatedText.replace(/\s+/g, ' ').trim().slice(0, 160);

          return `
            <button class="translatorHistoryItem" type="button" data-translation-id="${escapeHTML(item.id)}">
              <div class="translatorHistoryTop">
                <span class="translatorHistoryLang">${escapeHTML(sourceLabel)} → ${escapeHTML(targetLabel)}</span>
                <span>${escapeHTML(getTranslatorHistoryDate(item.createdAt))}</span>
              </div>
              <p class="translatorHistorySource">${escapeHTML(sourcePreview)}</p>
              <p class="translatorHistoryResult">${escapeHTML(resultPreview)}</p>
            </button>

      function renderTranslator() {

        dom.translatorBadge.textContent = translatorT.badge;

        dom.translatorAutoBtn.textContent = state.translator.autoMode ? translatorT.autoModeOn : translatorT.autoModeOff;
        dom.translatorSwapBtn.textContent = translatorT.swap;
        dom.clearTranslatorBtn.textContent = translatorT.clear;
        dom.copyTranslationBtn.textContent = translatorT.copy;
        dom.clearTranslatorHistoryBtn.textContent = translatorT.clearHistory;
        dom.translatorHistoryTitle.textContent = translatorT.historyTitle;
        dom.translatorHistorySubtitle.textContent = translatorT.historySubtitle;

        if (dom.translateInput.value !== state.translator.inputText) {

        }

        dom.translatorAutoBtn.classList.toggle('active', state.translator.autoMode);
        dom.translatorAutoBtn.setAttribute('aria-pressed', state.translator.autoMode ? 'true' : 'false');
        dom.translateInputMeta.textContent = translatorT.characters(state.translator.inputText.length);
        dom.translateOutputMeta.textContent = translatorT.characters(state.translator.outputText.length);

        if (state.translator.outputText) {
          dom.translateOutput.textContent = state.translator.outputText;
          dom.translateOutput.classList.remove('is-empty');
        } else {
          dom.translateOutput.textContent = translatorT.outputPlaceholder;
          dom.translateOutput.classList.add('is-empty');
        }

        const status = state.translatorStatusMessage
          ? { text: state.translatorStatusMessage, type: state.translatorStatusType }
          : getTranslatorStatusFallback();

        dom.translatorStatus.textContent = status.text;
        dom.translatorStatus.className = `translatorStatus ${status.type || 'info'}`;
        renderTranslatorHistory();
      }

      function addTranslatorHistoryEntry(entry) {
        const normalizedSource = String(entry.sourceText || '').trim();
        const normalizedTranslated = String(entry.translatedText || '').trim();
        if (!normalizedSource || !normalizedTranslated) return;

        const historyEntry = {
          id: safeRandomId(),
          from: normalizeTranslatorLanguageCode(entry.from, true) || state.translator.from,
          to: normalizeTranslatorLanguageCode(entry.to) || state.translator.to,
          sourceText: normalizedSource,
          translatedText: normalizedTranslated,
          detectedLanguage: normalizeTranslatorLanguageCode(entry.detectedLanguage) || '',
          createdAt: new Date().toISOString()
        };

        state.translator.history = [
          historyEntry,
          ...state.translator.history.filter(item =>
            !(item.sourceText === historyEntry.sourceText && item.to === historyEntry.to && item.translatedText === historyEntry.translatedText)
          )
        ].slice(0, 10);

        saveState();
        if (state.activeTab === 'translator') renderTranslatorHistory();
      }

      function clearTranslatorHistory() {
        state.translator.history = [];
        saveState();
        renderTranslatorHistory();
        setTranslatorStatus(tr().translator.historyCleared, 'warning');
      }

      function restoreTranslatorHistoryEntry(id) {
        const entry = state.translator.history.find(item => item.id === id);
        if (!entry) return;

        state.translator.from = entry.from;
        state.translator.to = entry.to;
        state.translator.inputText = entry.sourceText;
        state.translator.outputText = entry.translatedText;
        state.translator.detectedLanguage = entry.detectedLanguage || '';
        saveState();
        renderTranslator();
        setTranslatorStatus(tr().translator.restored, 'success');
      }

      function cancelTranslatorRequest() {
        if (state.translatorAbortController) {
          state.translatorAbortController.abort();
          state.translatorAbortController = null;
        }
        if (state.translatorDebounceId) {
          clearTimeout(state.translatorDebounceId);
          state.translatorDebounceId = null;
        }
        state.translatorBusy = false;
      }

      function getAlternateTranslatorTarget(sourceCode) {
        const preferred = sourceCode === 'ru' ? 'en' : 'ru';
        if (preferred && preferred !== sourceCode) return preferred;
        return TRANSLATOR_LANGUAGES.find(item => item.code !== 'auto' && item.code !== sourceCode)?.code || 'en';
      }

      function clearTranslatorFields() {
        cancelTranslatorRequest();
        state.translator.inputText = '';
        state.translator.outputText = '';
        state.translator.detectedLanguage = '';
        saveState();
        renderTranslator();
        setTranslatorStatus(tr().translator.cleared, 'info');
      }

      async function copyTranslationToClipboard() {
        const text = state.translator.outputText.trim();
        if (!text) {
          setTranslatorStatus(tr().translator.enterText, 'warning');
          return;
        }

        try {
          if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(text);
          } else {
            const helper = document.createElement('textarea');
            helper.value = text;
            helper.style.position = 'fixed';
            helper.style.opacity = '0';
            document.body.appendChild(helper);
            helper.focus();
            helper.select();
            document.execCommand('copy');
            helper.remove();
          }
          setTranslatorStatus(tr().translator.copied, 'success');
        } catch {
          setTranslatorStatus(tr().translator.error, 'error');
        }
      }

      function swapTranslatorLanguages() {
        const previousFrom = state.translator.from;
        const previousTo = state.translator.to;
        const nextFrom = previousTo;
        const nextTo = previousFrom === 'auto'
          ? (state.translator.detectedLanguage || getAlternateTranslatorTarget(previousTo))
          : previousFrom;

        state.translator.from = normalizeTranslatorLanguageCode(nextFrom, true) || 'auto';
        state.translator.to = normalizeTranslatorLanguageCode(nextTo) || getAlternateTranslatorTarget(state.translator.from === 'auto' ? 'ru' : state.translator.from);
        if (state.translator.to === state.translator.from) {
          state.translator.to = getAlternateTranslatorTarget(state.translator.from);
        }

        const currentInput = state.translator.inputText;
        state.translator.inputText = state.translator.outputText || currentInput;
        state.translator.outputText = currentInput;
        state.translator.detectedLanguage = '';
        saveState();
        renderTranslator();
        if (state.translator.autoMode && state.translator.inputText.trim()) {
          queueAutoTranslate();
        }
      }

      async function requestGoogleTranslation(text, from, to, signal) {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${encodeURIComponent(from)}&tl=${encodeURIComponent(to)}&dt=t&dt=ld&q=${encodeURIComponent(text)}`;
        const response = await fetch(url, { signal });
        if (!response.ok) throw new Error('google-translate-failed');
        const data = await response.json();
        const translatedText = Array.isArray(data?.[0]) ? data[0].map(item => item?.[0] || '').join('') : '';
        const detectedLanguage = normalizeTranslatorLanguageCode(data?.[2]) || '';
        if (!translatedText) throw new Error('google-translate-empty');
        return { translatedText, detectedLanguage };
      }

      async function requestMemoryTranslation(text, from, to, signal) {
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${encodeURIComponent(from)}|${encodeURIComponent(to)}`;
        const response = await fetch(url, { signal });
        if (!response.ok) throw new Error('memory-translate-failed');
        const data = await response.json();
        const translatedText = data?.responseData?.translatedText || '';
        if (!translatedText) throw new Error('memory-translate-empty');
        return { translatedText, detectedLanguage: normalizeTranslatorLanguageCode(from) || '' };
      }

      async function requestTranslation(text, from, to, signal) {
        try {
          return await requestGoogleTranslation(text, from, to, signal);
        } catch (error) {
          if (signal?.aborted) throw error;
          if (from === 'auto') throw error;
          return requestMemoryTranslation(text, from, to, signal);
        }
      }

      async function translateText({ addToHistory = false } = {}) {
        const translatorT = tr().translator;
        const inputText = state.translator.inputText.trim();

        if (!inputText) {
          state.translator.outputText = '';
          state.translator.detectedLanguage = '';
          saveState();
          renderTranslator();
          setTranslatorStatus(translatorT.enterText, 'warning');
          return;
        }

        if (state.translator.from !== 'auto' && state.translator.from === state.translator.to) {
          setTranslatorStatus(translatorT.sameLanguage, 'warning');
          return;
        }

        cancelTranslatorRequest();
        const cacheKey = `${state.translator.from}__${state.translator.to}__${inputText}`;
        const cached = state.translatorCache.get(cacheKey);

        if (cached) {
          state.translator.outputText = cached.translatedText;
          state.translator.detectedLanguage = cached.detectedLanguage || '';
          saveState();
          renderTranslator();
          if (addToHistory) {
            addTranslatorHistoryEntry({
              from: state.translator.from,
              to: state.translator.to,
              sourceText: inputText,
              translatedText: cached.translatedText,
              detectedLanguage: cached.detectedLanguage
            });
          }
          setTranslatorStatus(
            state.translator.from === 'auto' && cached.detectedLanguage
              ? translatorT.detected(getTranslatorLanguageLabel(cached.detectedLanguage))
              : translatorT.translated,
            'success'
          );
          incrementUsage('translator_used');
          return;
        }

        const controller = new AbortController();
        state.translatorAbortController = controller;
        state.translatorBusy = true;
        renderTranslator();

        try {
          const result = await requestTranslation(
            inputText,
            state.translator.from === 'auto' ? 'auto' : state.translator.from,
            state.translator.to,
            controller.signal
          );

          if (controller.signal.aborted) return;

          state.translator.outputText = String(result.translatedText || '').trim();
          state.translator.detectedLanguage = normalizeTranslatorLanguageCode(result.detectedLanguage) || '';
          state.translatorCache.set(cacheKey, {
            translatedText: state.translator.outputText,
            detectedLanguage: state.translator.detectedLanguage
          });
          saveState();

          if (addToHistory) {
            addTranslatorHistoryEntry({
              from: state.translator.from,
              to: state.translator.to,
              sourceText: inputText,
              translatedText: state.translator.outputText,
              detectedLanguage: state.translator.detectedLanguage
            });
          }

          setTranslatorStatus(
            state.translator.from === 'auto' && state.translator.detectedLanguage
              ? translatorT.detected(getTranslatorLanguageLabel(state.translator.detectedLanguage))
              : translatorT.translated,
            'success'
          );
          incrementUsage('translator_used');
        } catch (error) {
          if (controller.signal.aborted) return;
          setTranslatorStatus(translatorT.error, 'error');
        } finally {
          if (state.translatorAbortController === controller) {
            state.translatorAbortController = null;
          }
          state.translatorBusy = false;
          renderTranslator();
        }
      }

      function queueAutoTranslate() {
        if (!state.translator.autoMode) return;
        if (!state.translator.inputText.trim()) {
          state.translator.outputText = '';
          state.translator.detectedLanguage = '';
          saveState();
          renderTranslator();
          return;
        }

        if (state.translatorDebounceId) clearTimeout(state.translatorDebounceId);
        state.translatorDebounceId = setTimeout(() => {
          state.translatorDebounceId = null;
          translateText({ addToHistory: false });
        }, 420);
      }

      function updateTranslatorSourceLanguage(nextFrom) {
        const previousFrom = state.translator.from;
        state.translator.from = normalizeTranslatorLanguageCode(nextFrom, true) || 'auto';

        if (state.translator.from !== 'auto' && state.translator.from === state.translator.to) {
          state.translator.to = previousFrom !== 'auto' ? previousFrom : getAlternateTranslatorTarget(state.translator.from);
        }

        state.translator.detectedLanguage = '';
        saveState();
        renderTranslator();
        queueAutoTranslate();
      }

      function updateTranslatorTargetLanguage(nextTo) {
        const previousTo = state.translator.to;
        state.translator.to = normalizeTranslatorLanguageCode(nextTo) || getTranslatorDefaultTarget(state.language);

        if (state.translator.from !== 'auto' && state.translator.from === state.translator.to) {
          state.translator.from = previousTo || 'auto';
          if (state.translator.from === state.translator.to) state.translator.from = 'auto';
        }

        saveState();
        renderTranslator();
        queueAutoTranslate();
      }

      async function getCurrentPosition() {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) {
            reject(new Error('geolocation-not-supported'));
            return;
          }

          navigator.geolocation.getCurrentPosition(
            position => resolve(position),
            error => reject(error),
            {
              enableHighAccuracy: false,
              timeout: 9000,
              maximumAge: 300000
            }
          );
        });
      }

      async function fetchWeather() {
        renderWeatherLoading();

        try {
          const position = await getCurrentPosition();
          const { latitude, longitude } = position.coords;

          const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day&daily=temperature_2m_max,temperature_2m_min&forecast_days=1&timezone=auto`;
          const response = await fetch(url);
          if (!response.ok) throw new Error('weather-fetch-error');

          const data = await response.json();
          const current = data.current || {};
          const daily = data.daily || {};

          state.weatherData = {
            weatherCode: current.weather_code ?? 0,
            isDay: Boolean(current.is_day),
            temp: current.temperature_2m ?? 0,
            feels: current.apparent_temperature ?? 0,
            wind: current.wind_speed_10m ?? 0,
            max: Array.isArray(daily.temperature_2m_max) ? daily.temperature_2m_max[0] : 0,
            min: Array.isArray(daily.temperature_2m_min) ? daily.temperature_2m_min[0] : 0
          };

          renderWeather();
        } catch (error) {
          const code = typeof error.code === 'number' ? error.code : null;

          if (code === 1) renderWeatherError(tr().weather.denied);
          else if (code === 2) renderWeatherError(tr().weather.unavailable);
          else if (code === 3) renderWeatherError(tr().weather.timeout);
          else renderWeatherError(tr().weather.failed);
        }
      }

      function formatCurrencyUpdateDate(dateString) {
        if (!dateString) return '—';
        const date = new Date(dateString);
        if (Number.isNaN(date.getTime())) return '—';

        const formatter = new Intl.DateTimeFormat(state.language === 'en' ? 'en-US' : 'ru-RU', {
          year: 'numeric',
          month: 'long',
          day: 'numeric',
          timeZone: 'UTC'
        });

        return formatter.format(date);
      }

      async function fetchCurrencyRates() {
        renderCurrencyLoading();

        try {
          const [usdResponse, eurResponse] = await Promise.all([
            fetch('https://open.er-api.com/v6/latest/USD'),
            fetch('https://open.er-api.com/v6/latest/EUR')
          ]);

          if (!usdResponse.ok || !eurResponse.ok) throw new Error('currency-fetch-error');

          const usdData = await usdResponse.json();
          const eurData = await eurResponse.json();

          if (usdData.result !== 'success' || eurData.result !== 'success') {
            throw new Error('currency-result-error');
          }

          const usdRub = usdData?.rates?.RUB;
          const eurRub = eurData?.rates?.RUB;

          if (!usdRub || !eurRub) {
            throw new Error('currency-missing-rub');
          }

          state.currencyData = {
            usdRub,
            eurRub,
            time: usdData.time_last_update_utc || eurData.time_last_update_utc || ''
          };

          renderCurrency();
        } catch {
          renderCurrencyError(tr().currency.failed);
        }
      }
