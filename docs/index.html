      function resizeHomeFx() {
        const rect = dom.mainRoot.getBoundingClientRect();
        state.fxDpr = Math.min(window.devicePixelRatio || 1, 2);
        state.fxWidth = Math.max(1, Math.floor(rect.width));
        state.fxHeight = Math.max(1, Math.floor(rect.height));

        dom.homeFxCanvas.width = Math.floor(state.fxWidth * state.fxDpr);
        dom.homeFxCanvas.height = Math.floor(state.fxHeight * state.fxDpr);
        dom.homeFxCanvas.style.width = `${state.fxWidth}px`;
        dom.homeFxCanvas.style.height = `${state.fxHeight}px`;

        const count = state.reduceMotion
          ? 22
          : Math.max(28, Math.min(64, Math.floor((state.fxWidth * state.fxHeight) / 30000)));

        state.fxParticles = Array.from({ length: count }, () => ({
          x: Math.random() * state.fxWidth,
          y: Math.random() * state.fxHeight,
          vx: (Math.random() - 0.5) * (state.reduceMotion ? 0.16 : 0.30),
          vy: (Math.random() - 0.5) * (state.reduceMotion ? 0.16 : 0.30),
          size: Math.random() * 1.8 + 0.6
        }));
      }

      function drawHomeFx() {
        state.fxFrameId = null;
        if (!state.fxCtx) return;

        const ctx = state.fxCtx;
        ctx.setTransform(state.fxDpr, 0, 0, state.fxDpr, 0, 0);
        ctx.clearRect(0, 0, state.fxWidth, state.fxHeight);

        const particles = state.fxParticles;
        const pointer = state.fxPointer;
        const linkDistance = state.reduceMotion ? 90 : 120;
        const pointerDistance = state.reduceMotion ? 120 : 170;

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];

          p.x += p.vx;
          p.y += p.vy;

          if (p.x <= 0 || p.x >= state.fxWidth) p.vx *= -1;
          if (p.y <= 0 || p.y >= state.fxHeight) p.vy *= -1;

          p.x = Math.max(0, Math.min(state.fxWidth, p.x));
          p.y = Math.max(0, Math.min(state.fxHeight, p.y));

          if (pointer.active) {
            const dx = pointer.x - p.x;
            const dy = pointer.y - p.y;
            const dist = Math.hypot(dx, dy);

            if (dist < pointerDistance && dist > 0.01) {
              const force = (1 - dist / pointerDistance) * (state.reduceMotion ? 0.02 : 0.05);
              p.vx += (dx / dist) * force;
              p.vy += (dy / dist) * force;
            }
          }

          p.vx *= 0.994;
          p.vy *= 0.994;
        }

        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const a = particles[i];
            const b = particles[j];
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            const dist = Math.hypot(dx, dy);

            if (dist < linkDistance) {
              const alpha = (1 - dist / linkDistance) * 0.20;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
              ctx.lineWidth = 1;
              ctx.stroke();
            }
          }
        }

        if (pointer.active) {
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            const dx = pointer.x - p.x;
            const dy = pointer.y - p.y;
            const dist = Math.hypot(dx, dy);

            if (dist < pointerDistance) {
              const alpha = (1 - dist / pointerDistance) * 0.24;
              ctx.beginPath();
              ctx.moveTo(pointer.x, pointer.y);
              ctx.lineTo(p.x, p.y);
              ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
              ctx.lineWidth = 1.1;
              ctx.stroke();
            }
          }

          const glow = ctx.createRadialGradient(pointer.x, pointer.y, 0, pointer.x, pointer.y, state.reduceMotion ? 40 : 68);
          glow.addColorStop(0, 'rgba(255,255,255,0.18)');
          glow.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(pointer.x, pointer.y, state.reduceMotion ? 40 : 68, 0, Math.PI * 2);
          ctx.fill();
        }

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,0.82)';
          ctx.shadowBlur = 10;
          ctx.shadowColor = 'rgba(255,255,255,0.20)';
          ctx.fill();
        }

        ctx.shadowBlur = 0;
        syncHomeFxLoop();
      }

      function initHomeFx() {
        state.fxCtx = dom.homeFxCanvas.getContext('2d', { alpha: true });
        resizeHomeFx();

        dom.mainRoot.addEventListener('pointermove', event => {
          const rect = dom.mainRoot.getBoundingClientRect();
          state.fxPointer.x = event.clientX - rect.left;
          state.fxPointer.y = event.clientY - rect.top;
          state.fxPointer.active = true;
        });

        dom.mainRoot.addEventListener('pointerleave', () => {
          state.fxPointer.active = false;
        });

        window.addEventListener('resize', () => {
          resizeHomeFx();
          syncHomeFxLoop();
        });

        document.addEventListener('visibilitychange', syncHomeFxLoop);
        syncHomeFxLoop();
      }

        const tag = target.tagName?.toLowerCase();
        return tag === 'input' || tag === 'textarea' || tag === 'select' || target.isContentEditable;
      }

        dom.swStartBtn.addEventListener('click', startSW);
        dom.swPauseBtn.addEventListener('click', pauseSW);
        dom.swResetBtn.addEventListener('click', resetSW);

        dom.openAgreement.addEventListener('click', openAgreementModal);
        dom.closeAgreement.addEventListener('click', closeAgreementModal);

        dom.agreementModal.addEventListener('click', event => {
          if (event.target === dom.agreementModal) closeAgreementModal();
        });

        dom.calculatorGrid.addEventListener('click', event => {
          const button = event.target.closest('.calcBtn');
          if (!button) return;
          handleCalculatorButton(button.dataset.action, button.dataset.value || '');
        });

        dom.featureSearch.addEventListener('input', () => {
          const query = dom.featureSearch.value.trim();
          if (!query) {
            hideSearchSuggestions();
            return;
          }
          renderSearchSuggestions(getFeatureMatches(query).slice(0, 6));
        });

        dom.featureSearch.addEventListener('focus', () => {
          const query = dom.featureSearch.value.trim();
          if (query) {
            renderSearchSuggestions(getFeatureMatches(query).slice(0, 6));
          }
        });

        dom.featureSearch.addEventListener('keydown', event => {
          if (event.key === 'Enter') {
            event.preventDefault();
            executeFeatureSearch(dom.featureSearch.value);
          }
        });

        dom.featureSearchBtn.addEventListener('click', () => {
          executeFeatureSearch(dom.featureSearch.value);
        });

        dom.searchSuggestions.addEventListener('click', event => {
          const button = event.target.closest('.suggestionItem');
          if (!button) return;

          const featureId = button.dataset.featureId;
          const label = button.dataset.featureLabel;
          if (!featureId) return;

          addSearchHistory(label);
          openFeature(featureId, true);
          dom.featureSearch.value = '';
          hideSearchSuggestions();
        });

        dom.searchHistoryList.addEventListener('click', event => {
          const button = event.target.closest('.historyChip');
          if (!button) return;
          const value = button.dataset.historyItem || button.textContent || '';
          dom.featureSearch.value = value;
          executeFeatureSearch(value);
        });

        dom.clearSearchHistoryBtn.addEventListener('click', clearSearchHistory);

        dom.createNoteBtn.addEventListener('click', () => {
          openFeature('notes', true);
          createNote('title');
        });

        dom.emptyCreateNoteBtn.addEventListener('click', () => createNote('title'));

        dom.clearNotesSearchBtn.addEventListener('click', clearNotesSearch);

        dom.notesSearchInput.addEventListener('input', () => {
          state.notesSearchQuery = dom.notesSearchInput.value.trim();
          renderNotesList();
        });

        dom.notesList.addEventListener('click', event => {
          const button = event.target.closest('.noteCard');
          if (!button) return;
          selectNote(button.dataset.noteId || '');
        });

        dom.noteTitleInput.addEventListener('input', event => {
          updateActiveNoteField('title', event.target.value);
        });

        dom.noteBodyInput.addEventListener('input', event => {
          updateActiveNoteField('body', event.target.value);
        });

        dom.pinNoteBtn.addEventListener('click', toggleActiveNotePin);
        dom.deleteNoteBtn.addEventListener('click', deleteActiveNote);

        dom.translateFrom.addEventListener('change', event => {
          updateTranslatorSourceLanguage(event.target.value);
        });

        dom.translateTo.addEventListener('change', event => {
          updateTranslatorTargetLanguage(event.target.value);
        });

        dom.translateInput.addEventListener('input', event => {
          state.translator.inputText = String(event.target.value || '').slice(0, 5000);
          saveState();
          renderTranslator();
          queueAutoTranslate();
        });

        dom.translateNowBtn.addEventListener('click', () => {
          translateText({ addToHistory: true });
        });

        dom.translatorAutoBtn.addEventListener('click', () => {
          state.translator.autoMode = !state.translator.autoMode;
          saveState();
          renderTranslator();
          setTranslatorStatus(state.translator.autoMode ? tr().translator.autoHint : tr().translator.manualHint, 'info');
          if (state.translator.autoMode) queueAutoTranslate();
        });

        dom.translatorSwapBtn.addEventListener('click', swapTranslatorLanguages);
        dom.clearTranslatorBtn.addEventListener('click', clearTranslatorFields);
        dom.copyTranslationBtn.addEventListener('click', copyTranslationToClipboard);
        dom.clearTranslatorHistoryBtn.addEventListener('click', clearTranslatorHistory);

        dom.translateInput.addEventListener('keydown', event => {
          if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
            event.preventDefault();
            translateText({ addToHistory: true });
          }
        });

        dom.translatorHistory.addEventListener('click', event => {
          const button = event.target.closest('.translatorHistoryItem');
          if (!button) return;
          restoreTranslatorHistoryEntry(button.dataset.translationId || '');
        });

        dom.refreshWeatherBtn.addEventListener('click', fetchWeather);
        dom.refreshCurrencyBtn.addEventListener('click', fetchCurrencyRates);

        dom.frequentTools.addEventListener('click', event => {
          const button = event.target.closest('.quickToolBtn');
          if (!button) return;

          const actionId = button.dataset.frequentAction;
          const action = getFrequentActions().find(item => item.id === actionId);
          if (action) action.run();
        });

        document.addEventListener('click', event => {
          const searchWrap = dom.featureSearch.closest('.homeSearchWrap');
          if (searchWrap && !searchWrap.contains(event.target)) {
            hideSearchSuggestions();
          }

          if (!dom.languageDropdown.contains(event.target)) {
            closeLanguageMenu();
          }
        });

        document.addEventListener('keydown', event => {
          if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'n' && state.activeTab === 'notes') {
            event.preventDefault();
            createNote('title');
            return;
          }

          if ((event.metaKey || event.ctrlKey) && event.key === 'Enter' && state.activeTab === 'translator') {
            event.preventDefault();
            translateText({ addToHistory: true });
            return;
          }

          if (event.key === 'Escape') {
            if (dom.agreementModal.style.display === 'flex') {
              closeAgreementModal();
              return;
            }
            closeLanguageMenu();
            hideSearchSuggestions();
          }

          if (isEditableTarget(document.activeElement) || state.activeTab !== 'calculator') return;

          const key = event.key;

          if (/^\d$/.test(key)) {
            calculatorInputDigit(key);
            incrementUsage('calculator_used');
            return;
          }

          if (key === '.' || key === ',') {
            event.preventDefault();
            calculatorInputDecimal();
            incrementUsage('calculator_used');
            return;
          }

          if (['+', '-', '*', '/'].includes(key)) {
            event.preventDefault();
            calculatorSetOperator(key);
            incrementUsage('calculator_used');
            return;
          }

          if (key === 'Enter' || key === '=') {
            event.preventDefault();
            calculatorEquals();
            incrementUsage('calculator_used');
            return;
          }

          if (key === '%') {
            event.preventDefault();
            calculatorPercent();
            incrementUsage('calculator_used');
            return;
          }

          if (key === 'Backspace') {
            event.preventDefault();
            calculatorBackspace();
            incrementUsage('calculator_used');
            return;
          }

          if (key === 'Delete') {
            event.preventDefault();
            calculatorResetAll();
            incrementUsage('calculator_used');
          }
        });

        window.addEventListener('storage', event => {
          if ([STORAGE_KEY, ...LEGACY_KEYS].includes(event.key)) {
            loadState();
            applyTranslations();
          }
        });

        window.addEventListener('pointerdown', unlockAlarmAudio, { once: true });
        window.addEventListener('keydown', unlockAlarmAudio, { once: true });
      }

      function init() {
        loadState();
        bindEvents();
        applyTranslations();
        updateCurrentTime();
        renderStopwatch();
        renderCalculator();
        renderNotes();
        renderTranslator();
        hideAlarmUI();
        openFeature('home', false);
        initHomeFx();
        fetchWeather();
        fetchCurrencyRates();

        setInterval(() => {
          updateCurrentTime();
          updateNextAlarmInfo();
          checkAlarms();
        }, 1000);
      }

      init();
    })();
  </script>
</body>
</html>
